name: sprout
description: "Sprout plant care assistant — laboratory UI demo for iOS."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  firebase_analytics: ^13.0.0
  firebase_crashlytics: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/images/
    - assets/icons/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

